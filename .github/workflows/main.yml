name: React Build and Deploy Pipeline

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    name: Build & Deploy React App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'       

      - name: Install Dependencies
        run: npm ci 

      - name: Build Application
        run: npm run build

      # --- THE NEW DEPLOYMENT STEPS ---

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 # Make sure this matches your bucket's region!

      - name: Deploy to S3
        run: aws s3 sync build/ s3://for-github-workflow --delete