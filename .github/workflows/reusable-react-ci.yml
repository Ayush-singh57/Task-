name: Master Release Pipeline

on:
  push:
    branches:
      - main

jobs:
  # JOB 1: Deploy to Staging automatically on push
  deploy-to-staging:
    name: Staging Release
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment-name: 'Staging'
      s3-bucket: 'for-reusable-workflow'
    secrets: inherit

  # JOB 2: Deploy to Prod ONLY after Staging succeeds
  deploy-to-prod:
    name: Production Release
    needs: deploy-to-staging # This forces GitHub to wait for Staging to finish
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment-name: 'Production'
      s3-bucket: 'my-ap-south-1-indore'
    secrets: inherit